<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東非大裂谷｜3D 地形模型</title>
<style>
:root{--bg:#07111b;--panel:rgba(8,18,29,.88);--line:rgba(255,255,255,.12);--text:#eef7f2;--muted:#a8bbb4;--accent:#65d6a2}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--text)}
#app{position:fixed;inset:0}canvas{display:block}
#hud{position:absolute;top:18px;left:18px;width:min(390px,calc(100vw - 36px));padding:18px 20px;background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(12px);box-shadow:0 12px 40px rgba(0,0,0,.28)}
h1{font-size:20px;margin:0 0 5px}p{margin:5px 0;color:var(--muted);font-size:13px;line-height:1.6}
.badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(101,214,162,.12);color:var(--accent);border:1px solid rgba(101,214,162,.25);margin-bottom:8px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);padding:9px 10px;border-radius:9px;cursor:pointer;font-weight:600}
button:hover{background:rgba(255,255,255,.11);border-color:rgba(101,214,162,.45)}
#legend{position:absolute;right:18px;bottom:18px;width:180px;padding:13px 15px;background:var(--panel);border:1px solid var(--line);border-radius:13px;font-size:12px}
.scale{height:10px;border-radius:5px;margin:7px 0 5px;background:linear-gradient(90deg,#183d42,#27745a,#82a95e,#d2b76b,#b75d3e,#f0eee4)}
.labels{display:flex;justify-content:space-between;color:var(--muted)}
#info{position:absolute;right:18px;top:18px;padding:10px 13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--muted)}
@media(max-width:650px){#hud{top:10px;left:10px}.controls{grid-template-columns:1fr 1fr}#legend{right:10px;bottom:10px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div class="badge">GEOMORPHOLOGY · 3D TERRAIN</div>
  <h1>東非大裂谷 3D 地形模型</h1>
  <p>以東非大裂谷的典型地形特徵建立「概念性」數值高程模型：高原、陡峭裂谷肩、裂谷低地與火山錐。拖曳旋轉、滾輪縮放。</p>
  <div class="controls">
    <button id="reset">↺ 重設視角</button><button id="wire">⌁ 網格模式</button>
    <button id="exaggerate">⛰ 地形誇張 ×2</button><button id="labels">⌖ 顯示標示</button>
  </div>
</div>
<div id="info">滑鼠拖曳旋轉 · 滾輪縮放 · 右鍵平移</div>
<div id="legend"><b>概念高程</b><div class="scale"></div><div class="labels"><span>低</span><span>高</span></div><p style="margin-top:7px">色帶用於強化高低起伏，並非實際 DEM 色標。</p></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x07111b);
scene.fog=new THREE.FogExp2(0x07111b,0.0035);

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);
camera.position.set(13,15,18);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById("app").appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.target.set(0,0,0);
controls.minDistance=7; controls.maxDistance=42;
controls.maxPolarAngle=Math.PI*.48;

scene.add(new THREE.HemisphereLight(0xb9e8ff,0x18241c,2.0));
const sun=new THREE.DirectionalLight(0xffe7c2,3.0);
sun.position.set(-10,22,12); sun.castShadow=true; scene.add(sun);

const W=170,H=105,SEGX=170,SEGY=105;
const geo=new THREE.PlaneGeometry(W,H,SEGX,SEGY);
geo.rotateX(-Math.PI/2);
const pos=geo.attributes.position;
const colors=[];
const col=new THREE.Color();

function gauss(x,y,cx,cy,sx,sy){const dx=(x-cx)/sx,dy=(y-cy)/sy;return Math.exp(-(dx*dx+dy*dy));}
function ridge(x,y,cx,cy,sx,sy){return gauss(x,y,cx,cy,sx,sy);}
function heightAt(x,z){
  // Broad East African plateau
  let h=2.2 + 1.5*Math.sin(x*.075)*Math.sin(z*.055);
  h += 4.0*gauss(x,z,-48,-3,28,55);   // Ethiopian/East African highland block
  h += 2.5*gauss(x,z,42,5,35,50);     // eastern highland
  // Long rift trough: two approximately parallel branches
  const r1=z-(0.18*x+2), r2=z-(-0.14*x-17);
  h -= 5.7*Math.exp(-(r1*r1)/70);
  h -= 4.0*Math.exp(-(r2*r2)/95);
  // Rift shoulders
  h += 3.2*gauss(x,z,-17,5,10,48);
  h += 2.6*gauss(x,z,15,-8,12,46);
  // Lakes / basin floors
  h -= 2.4*gauss(x,z,-18,5,13,8);
  h -= 2.0*gauss(x,z,22,-13,15,9);
  // Volcanic cones
  h += 8.5*gauss(x,z,-39,-17,7,7);
  h += 7.2*gauss(x,z,5,19,6,6);
  h += 5.5*gauss(x,z,35,-5,5,5);
  // small-scale relief
  h += .65*Math.sin(x*.34+z*.12)+.38*Math.cos(z*.41-x*.16);
  return h;
}

let exaggeration=1.0;
function rebuild(){
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i);
    pos.setY(i,heightAt(x,z)*exaggeration);
  }
  pos.needsUpdate=true; geo.computeVertexNormals();
  colors.length=0;
  for(let i=0;i<pos.count;i++){
    const y=pos.getY(i);
    const t=THREE.MathUtils.clamp((y+4)/16,0,1);
    // low -> high
    const stops=[
      [0.00,0x183d42],[0.28,0x27745a],[0.52,0x82a95e],
      [0.72,0xd2b76b],[0.88,0xb75d3e],[1.00,0xf0eee4]
    ];
    let a=stops[0],b=stops[stops.length-1];
    for(let j=0;j<stops.length-1;j++) if(t>=stops[j][0]&&t<=stops[j+1][0]){a=stops[j];b=stops[j+1];break}
    const q=(t-a[0])/(b[0]-a[0]); col.set(a[1]).lerp(new THREE.Color(b[1]),q);
    colors.push(col.r,col.g,col.b);
  }
  geo.setAttribute("color",new THREE.Float32BufferAttribute(colors,3));
}
rebuild();

const mat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.92,metalness:0});
const terrain=new THREE.Mesh(geo,mat);
terrain.castShadow=true;terrain.receiveShadow=true;scene.add(terrain);

const baseGeo=new THREE.BoxGeometry(W+2,1.2,H+2);
const baseMat=new THREE.MeshStandardMaterial({color:0x101d22,roughness:1});
const base=new THREE.Mesh(baseGeo,baseMat); base.position.y=-5.1; base.receiveShadow=true;scene.add(base);

const labelGroup=new THREE.Group(); scene.add(labelGroup);
function label(text,x,y,z){
  const c=document.createElement("canvas"),ctx=c.getContext("2d");
  c.width=512;c.height=128;ctx.clearRect(0,0,512,128);
  ctx.font="700 34px Arial";ctx.fillStyle="#ffffff";ctx.textAlign="center";
  ctx.strokeStyle="rgba(0,0,0,.7)";ctx.lineWidth=8;ctx.strokeText(text,256,72);ctx.fillText(text,256,72);
  const tex=new THREE.CanvasTexture(c);const m=new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false});
  const s=new THREE.Sprite(m);s.position.set(x,y,z);s.scale.set(8,2,1);labelGroup.add(s);
}
label("東非大裂谷 Rift Valley",-2,8,1);
label("高原 Highlands",-45,9,-12);
label("裂谷低地 Rift Floor",13,1,-4);
label("火山錐",5,10,19);

const grid=new THREE.GridHelper(150,30,0x52736c,0x263c39);
grid.position.y=-4.45;grid.material.transparent=true;grid.material.opacity=.25;scene.add(grid);

document.getElementById("reset").onclick=()=>{camera.position.set(13,15,18);controls.target.set(0,0,0);controls.update()};
let wire=false;
document.getElementById("wire").onclick=()=>{wire=!wire;mat.wireframe=wire};
document.getElementById("exaggerate").onclick=()=>{exaggeration=exaggeration===1?2:1;rebuild()};
document.getElementById("labels").onclick=()=>{labelGroup.visible=!labelGroup.visible};

addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)} animate();
</script>
</body>
</html>
